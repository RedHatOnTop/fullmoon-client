<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="dark" />
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='9' fill='%236ea8ff'/%3E%3Cpath d='M22.5 6.5c-4.8.4-8.4 3.8-9.6 8.4l-2 3.1 2.4 2.4 3.1-2c4.6-1.2 8-4.8 8.4-9.6l-2.5 1.3c.3-1.2.4-2.4.1-3.6z' fill='%23061020'/%3E%3C/svg%3E"
    />
    <title>Pinion</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css"
    />
    <style>
      /* paint the void before the bundle lands — no white flash, ever */
      html, body { margin: 0; background: #06090f; }
      #root { min-height: 100vh; }
      #boot {
        position: fixed; inset: 0; display: grid; place-items: center;
        background: radial-gradient(120% 90% at 50% 0%, #0b1220 0%, #06090f 60%);
      }
      #boot .mark {
        width: 54px; height: 54px; border-radius: 16px;
        border: 1px solid rgba(110, 168, 255, .35);
        background: linear-gradient(160deg, rgba(110,168,255,.18), rgba(61,107,214,.06));
        animation: bootpulse 1.1s ease-in-out infinite alternate;
      }
      @keyframes bootpulse { from { transform: scale(.92); opacity: .55 } to { transform: scale(1); opacity: 1 } }
    </style>
  </head>
  <body>
    <div id="root"><div id="boot"><div class="mark"></div></div></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
