<!doctype html>
<html lang="ko" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="dark light" />
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='6' fill='%23B0481A'/%3E%3Cpath d='M22.5 6.5c-4.8.4-8.4 3.8-9.6 8.4l-2 3.1 2.4 2.4 3.1-2c4.6-1.2 8-4.8 8.4-9.6l-2.5 1.3c.3-1.2.4-2.4.1-3.6z' fill='%23F7F8F5'/%3E%3C/svg%3E"
    />
    <title>Pinion</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css"
    />
    <style>
      /* paint the void before the bundle lands — no white flash, ever */
      html, body { margin: 0; background: #0F100F; }
      #root { min-height: 100vh; }
      #boot {
        position: fixed; inset: 0; display: grid; place-items: center;
        background: #0F100F;
      }
      #boot .mark {
        width: 44px; height: 44px; border-radius: 6px;
        border: 1px solid #3D403D;
        background: #B0481A;
      }
    </style>
  </head>
  <body>
    <div id="root"><div id="boot"><div class="mark"></div></div></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
